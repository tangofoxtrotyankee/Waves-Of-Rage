<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Waves of Rage</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Phaser mounts its canvas inside this element and scales it to fit.
         overflow: hidden also stops the canvas' centring margin collapsing
         through this box, which would shift the touch overlay off-screen. */
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Nearest-neighbour upscaling for crisp pixel art.
         Phaser also sets this when pixelArt is enabled; this is a safety net. */
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* --- Touch controls (created by src/input/TouchControls.ts) --- */
      #touch {
        position: absolute;
        inset: 0;
        pointer-events: none; /* only the buttons take input; taps elsewhere reach the canvas */
        font-family: monospace;
        color: #fff;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #touch[hidden] {
        display: none;
      }
      .touch-pad,
      .touch-actions {
        position: absolute;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: grid;
        gap: 10px;
        pointer-events: none;
      }
      .touch-pad {
        left: calc(16px + env(safe-area-inset-left));
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
      }
      .touch-actions {
        right: calc(16px + env(safe-area-inset-right));
        grid-template-columns: repeat(2, 72px);
        grid-template-rows: 72px;
        align-items: end;
      }
      .touch-btn {
        pointer-events: auto;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: rgba(26, 11, 46, 0.55);
        border: 2px solid rgba(127, 246, 255, 0.55);
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 #1a0b2e;
        user-select: none;
      }
      .touch-btn.is-down {
        background: rgba(127, 246, 255, 0.45);
        border-color: #fff;
      }
      .touch-btn--round {
        border-radius: 50%;
        background: rgba(230, 57, 70, 0.5);
        border-color: rgba(255, 209, 102, 0.7);
      }
      .touch-btn--round.is-down {
        background: rgba(255, 209, 102, 0.6);
      }
      .touch-hint {
        position: absolute;
        bottom: calc(24px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        opacity: 0.7;
        text-shadow: 1px 1px 0 #1a0b2e;
        transition: opacity 0.6s ease;
      }
      #touch.touch--used .touch-hint {
        opacity: 0;
      }

      /* Portrait phones: the 16:9 canvas sits mid-screen; keep the controls in the black band below it. */
      @media (orientation: portrait) {
        .touch-pad {
          grid-template-columns: repeat(3, 64px);
          grid-template-rows: repeat(3, 64px);
        }
        .touch-actions {
          grid-template-columns: repeat(2, 84px);
          grid-template-rows: 84px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
