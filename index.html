<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Waves of Rage</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Phaser mounts its canvas inside this element and scales it to fit.
         overflow: hidden also stops the canvas' centring margin collapsing
         through this box, which would shift the touch overlay off-screen. */
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Nearest-neighbour upscaling for crisp pixel art.
         Phaser also sets this when pixelArt is enabled; this is a safety net. */
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #game {
        touch-action: none; /* the whole page is the drag surface */
      }

      /* --- Touch hint (src/input/TouchControls.ts); the whole page is the touch surface --- */
      #touch-hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(24px + env(safe-area-inset-bottom));
        text-align: center;
        font-family: monospace;
        font-size: 13px;
        color: #fff;
        opacity: 0.75;
        text-shadow: 1px 1px 0 #1a0b2e;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #game.touch--used #touch-hint {
        opacity: 0;
      }

      /* --- High-score name entry (src/ui/NameEntry.ts) --- */
      #name-entry {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        padding: 16px 20px;
        background: rgba(26, 11, 46, 0.95);
        border: 3px solid #7ff6ff;
        border-radius: 6px;
        font-family: monospace;
        color: #fff;
        text-align: center;
        z-index: 10;
        pointer-events: auto;
      }
      #name-entry .ne-title {
        color: #ffd166;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 2px;
      }
      #name-entry .ne-label {
        font-size: 12px;
        opacity: 0.8;
      }
      #name-entry input {
        width: 9ch;
        font: bold 24px monospace;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 3px;
        color: #fff;
        background: #000;
        border: 2px solid #ffd166;
        border-radius: 4px;
        padding: 6px 8px;
        outline: none;
      }
      #name-entry button {
        font: bold 16px monospace;
        padding: 8px 28px;
        color: #1a0b2e;
        background: #7ff6ff;
        border: 0;
        border-radius: 4px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
