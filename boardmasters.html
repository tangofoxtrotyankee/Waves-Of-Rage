<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Waves of Rage 2: Boardmasters</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The 3D canvas and the 2D HUD canvas are both rendered at the internal
         resolution and scaled up together with nearest-neighbour sampling
         (src/boardmasters/engine/Renderer.ts positions them). */
      #game {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        position: absolute;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Shown instead of the game when WebGL 2 is missing. */
      #message {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.6;
        color: #fff;
        text-align: center;
        background: #1a0b2e;
      }
      #message.show {
        display: flex;
      }
      #message a {
        color: #7ff6ff;
      }
    </style>
  </head>
  <body>
    <div id="game"><div id="message"></div></div>
    <script type="module" src="/src/boardmasters/main.ts"></script>
  </body>
</html>
