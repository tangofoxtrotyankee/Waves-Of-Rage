<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Waves of Rage 2: Boardmasters</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The 2D HUD canvas is drawn at the internal resolution and fitted inside
         the safe area (the padding below); the 3D canvas renders at a multiple
         of it on the same pixel grid and bleeds past it to the screen edges.
         Both are scaled up with nearest-neighbour sampling
         (src/boardmasters/engine/Renderer.ts positions them). */
      #game {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        position: absolute;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Shown instead of the game when WebGL 2 is missing. */
      #message {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: monospace;
        font-size: 14px;
        line-height: 1.6;
        color: #fff;
        text-align: center;
        background: #1a0b2e;
      }
      #message.show {
        display: flex;
      }
      #message a {
        color: #7ff6ff;
      }

      /* --- High-score name entry (src/ui/NameEntry.ts) --- */
      #name-entry {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        padding: 16px 20px;
        background: rgba(26, 11, 46, 0.95);
        border: 3px solid #7ff6ff;
        border-radius: 6px;
        font-family: monospace;
        color: #fff;
        text-align: center;
        z-index: 10;
        pointer-events: auto;
      }
      #name-entry .ne-title {
        color: #ffd166;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 2px;
      }
      #name-entry .ne-label {
        font-size: 12px;
        opacity: 0.8;
      }
      #name-entry input {
        width: 9ch;
        font: bold 24px monospace;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 3px;
        color: #fff;
        background: #000;
        border: 2px solid #ffd166;
        border-radius: 4px;
        padding: 6px 8px;
        outline: none;
      }
      #name-entry .ne-buttons {
        display: flex;
        gap: 10px;
      }
      #name-entry button {
        font: bold 16px monospace;
        padding: 8px 24px;
        color: #1a0b2e;
        background: #7ff6ff;
        border: 0;
        border-radius: 4px;
        letter-spacing: 2px;
      }
      #name-entry button.ne-skip {
        background: transparent;
        color: #bbb;
        border: 2px solid #555;
      }
    </style>
  </head>
  <body>
    <div id="game"><div id="message"></div></div>
    <script type="module" src="/src/boardmasters/main.ts"></script>
  </body>
</html>
